name: Forge Jira Custom Config

on:
  workflow_dispatch:

jobs:
  configure:
    name: Configure Forge variables (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jira-custom/epic-ai-actions
    env:
      FORGE_EMAIL: ${{ secrets.BMAD_JIRA_USERNAME }}
      FORGE_API_TOKEN: ${{ secrets.BMAD_JIRA_API_TOKEN }}
      BMAD_JIRA_BASE_URL: ${{ secrets.BMAD_JIRA_BASE_URL }}
      BMAD_FORGE_WEBHOOK_URL: ${{ secrets.BMAD_FORGE_WEBHOOK_URL }}
      BMAD_FORGE_WEBHOOK_SECRET: ${{ secrets.BMAD_FORGE_WEBHOOK_SECRET }}
      BMAD_JIRA_TARGET_REPO_CUSTOM_FIELD_ID: ${{ vars.BMAD_JIRA_TARGET_REPO_CUSTOM_FIELD_ID }}
      BMAD_JIRA_BRANCH_CUSTOM_FIELD_ID: ${{ vars.BMAD_JIRA_BRANCH_CUSTOM_FIELD_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Forge CLI
        run: npm install -g @forge/cli@latest

      - name: Install app dependencies
        run: npm ci

      # Forge CLI prompts for analytics consent on first run; CI has no TTY — set explicitly.
      - name: Disable Forge CLI usage analytics (CI)
        run: forge settings set usage-analytics false

      - name: Lint Forge app
        # CI has no TTY; omitting -e triggers interactive default-env prompts and fails.
        run: forge lint -e production

      # forge variables set prompts for encrypt/interactive input when value is omitted; CI has no TTY.
      - name: Verify Forge variable inputs are set
        shell: bash
        run: |
          missing=""
          [[ -z "${BMAD_FORGE_WEBHOOK_URL}" ]] && missing+=" BMAD_FORGE_WEBHOOK_URL"
          [[ -z "${BMAD_FORGE_WEBHOOK_SECRET}" ]] && missing+=" BMAD_FORGE_WEBHOOK_SECRET"
          [[ -z "${BMAD_JIRA_TARGET_REPO_CUSTOM_FIELD_ID}" ]] && missing+=" BMAD_JIRA_TARGET_REPO_CUSTOM_FIELD_ID"
          [[ -z "${BMAD_JIRA_BRANCH_CUSTOM_FIELD_ID}" ]] && missing+=" BMAD_JIRA_BRANCH_CUSTOM_FIELD_ID"
          if [[ -n "${missing}" ]]; then
            echo "::error::Set these GitHub secrets/vars (empty values make forge variables set open a TTY prompt and fail in CI):${missing}"
            exit 1
          fi

      - name: Set Forge variables (production)
        run: |
          forge variables set -e production BMAD_FORGE_WEBHOOK_URL "${BMAD_FORGE_WEBHOOK_URL}"
          forge variables set -e production --encrypt BMAD_FORGE_WEBHOOK_SECRET "${BMAD_FORGE_WEBHOOK_SECRET}"
          forge variables set -e production BMAD_JIRA_TARGET_REPO_CUSTOM_FIELD_ID "${BMAD_JIRA_TARGET_REPO_CUSTOM_FIELD_ID}"
          forge variables set -e production BMAD_JIRA_BRANCH_CUSTOM_FIELD_ID "${BMAD_JIRA_BRANCH_CUSTOM_FIELD_ID}"

      - name: Resolve Jira site host
        shell: bash
        run: |
          site="${BMAD_JIRA_BASE_URL#https://}"
          site="${site#http://}"
          site="${site%%/}"
          echo "FORGE_JIRA_SITE=${site}" >> "${GITHUB_ENV}"

      - name: Deploy Forge app
        run: forge deploy --non-interactive --environment production

      - name: Install or upgrade app on Jira site
        run: forge install --non-interactive --upgrade --site "${FORGE_JIRA_SITE}" --product jira --environment production
